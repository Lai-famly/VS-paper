<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>論文獎金統計分析儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  --navy:#1F3864; --navy2:#2F5597; --blue:#2E75B6; --lblue:#7F9CC9; --orange:#ED7D31; --gold:#FFC000;
  --bg:#EEF1F6; --surface:#FFFFFF; --zebra:#F5F8FC; --total:#E6ECF5; --ink:#1F2A3A; --ink2:#4E5B6E; --muted:#8792A2; --rule:#D5DCE6;
  --c-sci:#1F3864; --c-nsci:#4472C4; --c-intl:#ED7D31; --c-nat:#FFC000; --link:#1F4E9A; --onnavy:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#1B2F52; --navy2:#5B86D6; --blue:#4F95D6; --lblue:#6E8AB8; --bg:#0F1520; --surface:#18202D; --zebra:#1D2737; --total:#243149;
  --ink:#E3E9F2; --ink2:#AEB9C9; --muted:#7C889A; --rule:#2C3850; --c-sci:#7FA3E0; --c-nsci:#4472C4; --link:#8DB3F2;
}}
:root[data-theme="dark"]{
  --navy:#1B2F52; --navy2:#5B86D6; --blue:#4F95D6; --lblue:#6E8AB8; --bg:#0F1520; --surface:#18202D; --zebra:#1D2737; --total:#243149;
  --ink:#E3E9F2; --ink2:#AEB9C9; --muted:#7C889A; --rule:#2C3850; --c-sci:#7FA3E0; --c-nsci:#4472C4; --link:#8DB3F2;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.5}
.hd{background:var(--navy);color:var(--onnavy);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.badge{padding:0 20px 0 0;border-right:1px solid rgba(255,255,255,.35);display:flex;align-items:center;gap:12px;flex:none}
.badge img{height:56px;width:auto;display:block}
.badge span{color:#FFFFFF;font-size:24px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.hd h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em}
.hd p{margin:2px 0 0;font-size:13.5px;opacity:.88}
.hd .btns{display:flex;gap:14px}
.hbtn{font:inherit;font-size:15px;border-radius:4px;padding:8px 18px;cursor:pointer;min-height:42px}
.hbtn.outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75)}
.hbtn.outline:hover{background:rgba(255,255,255,.1)}
.hbtn.solid{background:var(--orange);color:#fff;border:1px solid var(--orange)}
.hbtn.solid:hover{filter:brightness(1.06)}
.hbtn:disabled{opacity:.6;cursor:progress}
.tabs{background:var(--surface);border-bottom:1px solid var(--rule);display:flex;gap:2px;padding:0 14px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.tabs button{font:inherit;font-size:16px;color:var(--ink2);background:none;border:none;border-bottom:3px solid transparent;padding:14px 16px 12px;white-space:nowrap;cursor:pointer}
.tabs button:hover{color:var(--navy2)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--navy2)}
.tabs .num{display:inline-block;width:17px;height:17px;border:1px solid currentColor;border-radius:50%;font-size:11px;line-height:15px;text-align:center;margin-right:4px;vertical-align:2px}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
main{padding:24px 20px 40px}
.card{max-width:1460px;margin:0 auto;background:var(--surface);border-top:9px solid var(--navy);border-radius:10px;padding:30px 40px 0;min-height:calc(100vh - 230px);display:flex;flex-direction:column}
.card[hidden]{display:none}
.cbody{flex:1}
.cfoot{border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:12px 0 14px;margin-top:24px}
h2.pt{font-size:30px;margin:0;color:var(--navy2);font-weight:700}
:root h2.pt{color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2.pt{color:var(--ink)}}
:root[data-theme="dark"] h2.pt{color:var(--ink)}
.center{text-align:center}
.psub{color:var(--ink2);font-size:16px;margin:6px 0 18px}
.stitle{border-left:4px solid var(--navy);padding-left:10px;font-weight:700;font-size:18px;margin:22px 0 10px;color:var(--ink)}
.note{font-size:14px;color:var(--ink2);text-align:center;margin-top:12px}

/* cover */
.cover{text-align:center;padding:60px 0 30px}
.cover h2{font-size:clamp(34px,4.4vw,56px);line-height:1.25;margin:0;font-weight:700;color:var(--navy)}
.cover .tag{font-size:20px;letter-spacing:.18em;color:var(--ink2);margin:26px 0 54px}
.cover .tag span{margin:0 14px;color:var(--ink2)}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1480px;margin:0 auto}
.kpi4 div{border:1px solid var(--rule);border-radius:8px;background:var(--zebra);padding:22px 10px 18px}
.kpi4 b{display:block;font-size:40px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi4 span{font-size:15px;color:var(--ink2)}
.src{margin-top:34px;font-size:17px;color:var(--ink);line-height:1.6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cover h2,:root:not([data-theme="light"]) .kpi4 b{color:var(--ink)}}
:root[data-theme="dark"] .cover h2,:root[data-theme="dark"] .kpi4 b{color:var(--ink)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
table.t th{background:var(--navy);color:#fff;font-weight:700;padding:9px 10px;text-align:center;white-space:nowrap;border-right:1px solid rgba(255,255,255,.22)}
table.t td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
table.t td:first-child{border-left:1px solid var(--rule)}
table.t tbody tr:nth-child(even) td{background:var(--zebra)}
table.t tr.tot td{background:var(--total)!important;font-weight:700}
table.t td.l{text-align:left}
table.t td.b{font-weight:700}
table.t.sm{font-size:14px}
table.t.sm th{padding:6px 8px}table.t.sm td{padding:5px 8px}
table.t tr.sec td{background:var(--total)!important;text-align:left;font-weight:500;font-size:13.5px;color:var(--ink2)}
.lnk{font:inherit;color:var(--link);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.lnk:hover{color:var(--orange)}
.cell2 small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.2}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.g2b{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:start}
.cbox{position:relative;height:470px}
.insight{text-align:center;font-weight:700;font-size:17px;color:var(--navy);margin-top:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .insight{color:var(--ink)}}
:root[data-theme="dark"] .insight{color:var(--ink)}
details.more{margin-top:20px}
details.more summary{cursor:pointer;font-weight:700;font-size:17px;color:var(--navy2);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▶";font-size:12px;margin-right:8px;display:inline-block;transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
.legend{display:flex;justify-content:center;gap:22px;margin-top:6px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* query */
.qbar{display:flex;justify-content:center;gap:12px;margin:8px 0 26px;flex-wrap:wrap}
.qbar input{font:inherit;font-size:17px;padding:9px 14px;border:1px solid var(--rule);border-radius:4px;width:340px;max-width:100%;background:var(--surface);color:var(--ink)}
.qbar button{font:inherit;font-size:17px;background:var(--navy);color:#fff;border:none;border-radius:4px;padding:9px 20px;cursor:pointer;min-height:44px}
.pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pick button{font:inherit;font-size:15px;border:1px solid var(--rule);background:var(--zebra);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
.pick button:hover{border-color:var(--navy2)}
.prof h3{font-size:26px;margin:0;color:var(--ink)}
.prof .meta{color:var(--ink2);margin:2px 0 16px}
.kpi4.sm b{font-size:30px}
.empty{text-align:center;color:var(--ink2);padding:30px 0}
.paper .j{font-size:13px;color:var(--ink2)}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,25,40,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 30px;overflow:auto}
.mbg.open{display:flex}
.modal{background:var(--surface);border-radius:8px;width:min(1100px,100%);overflow:hidden}
.mh{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.mh h4{margin:0;font-size:20px}
.mh button{background:none;border:none;color:#fff;font-size:28px;line-height:1;cursor:pointer;width:40px;height:40px}
.mb{padding:18px 20px 16px;max-height:calc(100vh - 160px);overflow:auto}
.mb .note{font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:6px;font-size:14px;z-index:60;display:none;max-width:90vw}
input[type=file]{display:none}
@media (max-width:900px){.g2,.g2b{grid-template-columns:1fr}.kpi4{grid-template-columns:repeat(2,1fr)}.card{padding:22px 16px 0}.hd{padding:12px 16px}.badge img{height:44px}.badge span{font-size:20px}h2.pt{font-size:24px}.cbox{height:360px}}
</style>
</head>

let D=null; // {recs, years, cutY, cutM, file}
function build(rows,vs,file){
  const recs=[];let cutY=0,cutM=0;
  for(const r of rows){
    const id=String(r['申請者']||'').trim().split(/\s+/)[0];const v=vs[id];if(!v)continue;
    const ym=String(r['發表日期']||'').trim();const y=parseInt(ym.slice(0,4),10)-1911;if(!(y>0))continue;
    const c=String(r['論文類別']||'').trim();
    const k=c.includes('會議')?(c.includes('國際')?'國際性醫學會議':'全國性醫學會議'):(c.startsWith('非SCI')?'非SCI':'SCI');
    const num=(s,re)=>{const m=String(s||'').match(re);const x=m?parseFloat(m[1]):0;return x>0?x:null;};
    recs.push({id,nm:v[2],dv:v[0],dp:v[1],y,ym,c,k,b:parseFloat(r['獎金'])||0,f:num(r['IF'],/IF\s*([\d.]+)/),rk:num(r['學門排行'],/Rank\s*([\d.]+)/),
      t:String(r['論文名稱']||''),j:String(r['發表之雜誌/期刊']||''),n:String(r['備註']||''),p:String(r['發表地點']||'')});
    const s=String(r['主管簽章']||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(s){const sy=+s[3]-1911,sm=+s[1];if(sy>cutY||(sy===cutY&&sm>cutM)){cutY=sy;cutM=sm;}}
  }
  const years=[...new Set(recs.map(r=>r.y))].sort((a,b)=>a-b);
  if(!cutY){const mx=recs.reduce((a,r)=>r.ym>a?r.ym:a,'0');cutY=+mx.slice(0,4)-1911;cutM=+mx.slice(4,6);}
  return {recs,years,cutY,cutM,file};
}
const Y=()=>D.years, LAST=()=>D.years[D.years.length-1];
const yl=y=>y===LAST()?y+'*':String(y);
const cutTxt=()=>`${D.cutY}/${String(D.cutM).padStart(2,'0')}`;
const rangeTxt=()=>`${Y()[0]}–${LAST()}年度`;
const sum=(rs,f)=>rs.reduce((a,r)=>a+(f?f(r):r.b),0);
function groupBy(rs,key){const m=new Map();rs.forEach(r=>{const k=typeof key==='function'?key(r):r[key];if(!m.has(k))m.set(k,[]);m.get(k).push(r);});return m;}
function yearVals(rs,metric){return Y().map(y=>{const s=rs.filter(r=>r.y===y);return metric==='b'?sum(s):s.length;});}

const labelPlugin={id:'vlabels',afterDatasetsDraw(ch,a,opt){if(!opt||!opt.on)return;const {ctx}=ch;ctx.save();ctx.fillStyle=css('--ink');ctx.font='600 13px "Noto Sans TC",sans-serif';
  if(opt.total){const metas=ch.data.datasets.map((d,i)=>ch.getDatasetMeta(i));ch.data.labels.forEach((l,j)=>{let t=0,top=1e9,x=0;metas.forEach((m,i)=>{if(m.hidden)return;t+=ch.data.datasets[i].data[j]||0;const el=m.data[j];top=Math.min(top,el.y);x=el.x;});
    ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(opt.fmt(t),x,top-4);});}
  else ch.data.datasets.forEach((d,i)=>{const m=ch.getDatasetMeta(i);m.data.forEach((el,j)=>{const v=d.data[j];const horiz=ch.options.indexAxis==='y';
    if(horiz){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(opt.fmt(v),el.x+6,el.y);}else{ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(opt.fmt(v),el.x,el.y-8);}});});
  ctx.restore();}};

function deptAgg(){const m=groupBy(D.recs,'dv');return [...m].map(([dv,rs])=>({dv,rs,n:rs.length,b:sum(rs),p:new Set(rs.map(r=>r.id)).size})).sort((a,b)=>b.b-a.b);}
function peopleAgg(){const m=groupBy(D.recs,'id');return [...m].map(([id,rs])=>({id,nm:rs[0].nm,dv:rs[0].dv,dp:rs[0].dp,rs,n:rs.length,b:sum(rs),sci:rs.filter(r=>r.k==='SCI').length})).sort((a,b)=>b.b-a.b);}
function yearHead(first){return `<tr><th>${first}</th>${Y().map(y=>`<th>${yl(y)}</th>`).join('')}<th>累計</th></tr>`;}

function trendInsight(){const ys=Y();const full=ys.filter(y=>y!==LAST());if(full.length<2)return '';
  const a=full[0],b=full[full.length-1];const ba=sum(D.recs.filter(r=>r.y===a)),bb=sum(D.recs.filter(r=>r.y===b));const na=D.recs.filter(r=>r.y===a).length,nb=D.recs.filter(r=>r.y===b).length;
  const pc=(x,y)=>(y>=x?'+':'')+Math.round((y-x)/x*100)+'%';
  return `${a}→${b} 年：獎金 ${w1(ba)} → ${w1(bb)} 萬元（${pc(ba,bb)}）；篇數 ${fmt(na)} → ${fmt(nb)} 篇（${pc(na,nb)}）`;}

function deptYearTable(metric){

  const tbl=part=>`<div class="tw"><table class="t sm"><thead>${yearHead('科部')}</thead><tbody>${part.map(d=>`<tr><td class="l"><button class="lnk" data-dv="${esc(d.dv)}">${esc(d.dv)}</button></td>${d.v.map(x=>`<td>${f(x)}</td>`).join('')}<td class="b">${f(d.tot)}</td></tr>`).join('')}</tbody></table></div>`;

function catModal(k){
  const rs=D.recs.filter(r=>r.k===k);const subs=[...groupBy(rs,'c')].sort((a,b)=>b[1].length-a[1].length);
  const block=(metric)=>{const f=metric==='b'?w1:fmt;const tv=yearVals(rs,metric);const T=tv.reduce((a,b)=>a+b,0);
    const pct=(x,t)=>t?(Math.round(x/t*1000)/10)+'%':'0%';
    return `<div class="tw"><table class="t sm"><thead>${yearHead('細分類別')}</thead><tbody>${subs.map(([c,x])=>{const v=yearVals(x,metric);const s=v.reduce((a,b)=>a+b,0);
      return `<tr><td class="l">${esc(c)}</td>${v.map((q,i)=>`<td class="cell2">${f(q)}<small>${pct(q,tv[i])}</small></td>`).join('')}<td class="cell2 b">${f(s)}<small>${pct(s,T)}</small></td></tr>`;}).join('')}
      <tr class="tot"><td>合計</td>${tv.map(x=>`<td>${f(x)}</td>`).join('')}<td>${f(T)}</td></tr></tbody></table></div>`;};
  openModal(`${k}｜細分類別統計`,`<div class="stitle" style="margin-top:0">篇數（佔比）</div>${block('n')}<div class="stitle">獎金（萬元，佔比）</div>${block('b')}<p class="note">佔比為該細分類別占當年度「${k}」合計之比例。*${LAST()}年度為截至${cutTxt()}資料</p>`);
}

const fileIn=document.getElementById('file');
document.getElementById('btnReload').onclick=()=>{toast('請選擇論文資料 .xls（可同時選取 VS 科別歸屬 .xlsx）',4000);fileIn.click();};
fileIn.onchange=async()=>{
  const files=[...fileIn.files];fileIn.value='';if(!files.length)return;
  if(typeof XLSX==='undefined'){toast('無法載入 Excel 解析元件，請稍後再試。');return;}
  try{let paper=null,pname='',vs=null;
    for(const f of files){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      for(const sn of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false});if(!rows.length)continue;const h=Object.keys(rows[0]);
        if(h.includes('論文類別')&&h.includes('申請者')){paper=rows;pname=f.name;break;}
        if(h.includes('人事號')&&h.includes('分科')&&!vs){vs={};rows.forEach(r=>{const id=String(r['人事號']).trim();if(id)vs[id]=[String(r['分科']).trim(),String(r['科別名稱']||r['分科']).trim(),String(r['姓名']).trim()];});}}}
    if(!paper){toast('找不到論文資料：檔案需含「申請者」與「論文類別」欄位。');return;}
    const nd=build(paper,vs||VSMAP,pname);if(!nd.recs.length){toast('沒有可對應到 VS 科別歸屬的資料，請一併選取 VS 科別歸屬檔。');return;}
    D=nd;qState='';Object.values(charts).forEach(c=>c.destroy());for(const k in charts)delete charts[k];renderAll();
    toast(`已載入 ${pname}：計入 ${fmt(D.recs.length)} 筆${vs?'（使用新的 VS 科別歸屬）':''}`);
  }catch(e){console.error(e);toast('讀取檔案失敗：'+(e.message||e));}
};

   s.addChart(pptx.ChartType.bar,CATS.map(k=>({name:k,labels:yh,values:yearVals(D.recs.filter(r=>r.k===k),'b').map(v=>+(v/1e4).toFixed(1))})),{x:6.75,y:1.3,w:6.2,h:3.3,barDir:'col',barGrouping:'stacked',chartColors:['1F3864','4472C4','ED7D31','FFC000'],showLegend:true,legendPos:'b',legendFontFace:F,legendFontSize:9,catAxisLabelFontFace:F,valAxisLabelFontFace:F,catAxisLabelFontSize:9,valAxisLabelFontSize:8,valGridLine:{color:'E5E5E5',size:0.5},catGridLine:{style:'none'},showTitle:true,title:'獎金（萬元）',titleFontSize:12,titleColor:NAVY,titleFontFace:F});
   [['n','篇數'],['b','獎金（萬元）']].forEach(([m,lab],pi)=>{const f=m==='b'?w1:fmt;const rows=[[hc(lab),...yh.map(hc),hc('累計')]];
     CATS.forEach((k,i)=>{const v=yearVals(D.recs.filter(r=>r.k===k),m);rows.push([cell(k,{align:'left'}),...v.map(x=>cell(f(x))),cell(f(v.reduce((a,b)=>a+b,0)),{bold:true})].map(c=>(i%2&&(c.options.fill={color:ZB}),c)));});
     const tv=yearVals(D.recs,m);rows.push([cell('合計',{bold:true,fill:{color:TT}}),...tv.map(x=>cell(f(x),{bold:true,fill:{color:TT}})),cell(f(tv.reduce((a,b)=>a+b,0)),{bold:true,fill:{color:TT}})]);
     s.addTable(rows,{x:0.4+pi*6.35,y:4.75,w:6.2,colW:[1.6,...ys.map(()=>3.6/ys.length),1.0],fontFace:F,fontSize:9,border:{type:'solid',color:'D5DCE6',pt:0.5},rowH:0.3,valign:'middle',margin:0.03});});}
  return pptx;
}
window.__buildPptx=buildPptx;
let dl=null;
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use('downloads');}catch(e){}})();
document.getElementById('btnPpt').onclick=async()=>{
  const btn=document.getElementById('btnPpt');
  if(typeof PptxGenJS==='undefined'){toast('無法載入簡報產生元件，請稍後再試。');return;}
  if(!dl){toast('此檢視不支援下載檔案，請在 claude.ai 開啟此頁面後再匯出。',4500);return;}
  btn.disabled=true;btn.textContent='產生中…';
  try{const p=await buildPptx();const blob=await p.write({outputType:'blob'});
    await dl.save({filename:`${rangeTxt()}_論文獎金統計簡報.pptx`,data:blob});toast('已匯出 PPT。');}
  catch(e){if(e&&e.code==='declined')toast('已取消匯出。');else if(e&&e.code==='rate_limited')toast('已有下載視窗開啟中，請稍候再試。');else{console.error(e);toast('匯出失敗：'+(e.message||e.code||e));}}
  finally{btn.disabled=false;btn.textContent='匯出 PPT';}
};
